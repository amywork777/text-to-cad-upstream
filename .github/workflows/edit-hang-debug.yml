# TEMPORARY: diagnose test_edit_commands.py's slowness/hang on Windows. Removed before merge.
name: Edit hang debug

on:
  push:
    branches:
      - amy/edit-hang-debug
      - amy/edit-hang-fix

concurrency:
  group: edit-hang-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: edit_commands (${{ matrix.os }} ${{ matrix.copy }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        copy: [1, 2, 3, 4, 5]
        include:
          - os: ubuntu-latest
            copy: 1
    steps:
      - uses: actions/checkout@v7
      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: packages/core
      - name: Run test_edit_commands.py alone, with a long guard
        shell: bash
        env:
          CAD_EDIT_DEBUG_DIR: ${{ runner.temp }}/editdbg
          PYTHON_TEST_PRINT_WEIGHTS: "1"
        run: |
          mkdir -p "$CAD_EDIT_DEBUG_DIR"
          sed -i.bak 's/^FILE_HANG_SECONDS = 10 \* 60/FILE_HANG_SECONDS = 30 * 60/' scripts/test/unittest_files.py
          start=$(date +%s)
          scripts/test/test-python.sh --select cadgen --print-weights tests/python/packages/cad/test_edit_commands.py || echo "EXIT $?"
          echo "TOTAL $(( $(date +%s) - start ))s"
      - name: Show the service log
        if: always()
        shell: bash
        run: |
          cd "${{ runner.temp }}/editdbg" || exit 0
          ls -la
          for f in service-*.log; do echo "=== $f"; cat "$f"; done
      - name: Show slow tracer requests
        if: always()
        shell: bash
        run: |
          cd "${{ runner.temp }}/editdbg" || exit 0
          for f in tracer-*.err; do echo "=== $f ($(wc -l < "$f") lines)"; head -c 20000 "$f"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editdbg-${{ matrix.os }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/editdbg
