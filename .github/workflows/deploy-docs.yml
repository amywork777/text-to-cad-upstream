name: Deploy Docs

# Deploys the docs site from a SOURCE ref, not from main.
#
# The docs app is a website, not something anyone installs. It builds against
# repo-root packages/ (apps/docs/tsconfig.json maps cadgen-js/* to
# ../../packages/cadgen-js/src/*), so it needs a full source tree. main carries
# one since the publish trim stopped at models/, but the site is still deployed
# from the commit the release was cut from: that is the tree the docs describe,
# and publish commits from before the trim change have no apps/ at all.
#
# Releases pass the release SOURCE commit (release-pr's source_sha), which already
# carries the bumped VERSION and the stamped apps/docs/package.json that the site header
# reads. To redeploy a past release, use that release's source commit -- every
# publish commit records it as its second parent, so `git rev-parse <tag>^2`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to deploy — develop, or a release source commit (git rev-parse <tag>^2). Not main.
        required: true
        default: develop
        type: string
  workflow_call:
    inputs:
      ref:
        description: Source ref to deploy.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs app
    runs-on: ubuntu-latest

    steps:
      - name: Check out deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A publish commit from before the trim stopped at models/ has neither, and
      # the failure would otherwise surface as an opaque module-resolution error
      # deep in `next build`.
      - name: Check this ref can build the docs site
        run: |
          missing=""
          [ -d apps/docs ] || missing="$missing apps/docs/"
          [ -d packages/cadgen-js/src ] || missing="$missing packages/cadgen-js/src"
          if [ -n "$missing" ]; then
            echo "This ref cannot build the docs site; missing:$missing" >&2
            echo "This looks like a publish commit from before main carried apps/ and packages/." >&2
            echo "Deploy from a source ref instead — develop, or a release source" >&2
            echo "commit: git rev-parse <tag>^2" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@50.28.0

      - name: Deploy docs app to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_DOCS_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          scripts/github-workflows/deploy-vercel-app.sh \
            --label "Docs app" \
            --project-id "$VERCEL_DOCS_PROJECT_ID" \
            --public-urls "https://www.texttocad.dev https://texttocad.dev"
