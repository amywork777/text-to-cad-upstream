# Studio's own: Jake's Test workflow on studio-base, the branch Studio pins. Test itself runs only
# for main, and its file is Jake's, so this calls it rather than editing it; what a change touches
# still decides what runs (select_checks.py), and `CI` is the one check to read.
name: Studio base test

on:
  pull_request:
    branches:
      - studio-base
  push:
    branches:
      - studio-base

concurrency:
  group: studio-base-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # What Test's jobs ask for: a push looks up the run that already tested its tree.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test.yml

  jake-edits:
    # Studio's own: the files of Jake's that studio-base changes are exactly those in
    # scripts/studio-jake-edits.txt (AGENTS.md, On studio-base).
    name: Jake's files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check Jake's files studio-base changes
        run: bash scripts/studio-jake-edits.sh
